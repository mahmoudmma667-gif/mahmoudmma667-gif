<svg width="840" height="460" viewBox="0 0 840 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="840" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Player Outer Container -->
  <rect x="2" y="2" width="836" height="456" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="115" x2="840" y2="115"/>
    <line x1="0" y1="230" x2="840" y2="230"/>
    <line x1="0" y1="345" x2="840" y2="345"/>
    <line x1="210" y1="0" x2="210" y2="460"/>
    <line x1="420" y1="0" x2="420" y2="460"/>
    <line x1="630" y1="0" x2="630" y2="460"/>
  </g>

  <!-- Player Header Bar -->
  <rect x="2" y="2" width="836" height="48" rx="16" fill="#0b132b" fill-opacity="0.8"/>
  <rect x="2" y="30" width="836" height="20" fill="#0b132b" fill-opacity="0.8"/>
  <line x1="2" y1="50" x2="838" y2="50" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="28" cy="26" r="6" fill="#ef4444"/>
  <circle cx="48" cy="26" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="26" r="6" fill="#10b981"/>

  <!-- Category Tag -->
  <rect x="94" y="14" width="180" height="24" rx="6" fill="#1e293b"/>
  <text x="184" y="30" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">ACCESSIBILITY / ASSISTIVE AI</text>

  <!-- HD Spec Badges -->
  <rect x="710" y="14" width="105" height="24" rx="6" fill="#1e293b"/>
  <text x="762" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">MP4 • 0.4 MB</text>

  <!-- Central Glowing Play Button -->
  <g transform="translate(420, 220)">
    <!-- Outer Pulsing Ring -->
    <circle cx="0" cy="0" r="54" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <!-- Button Background with Glow -->
    <circle cx="0" cy="0" r="42" fill="url(#playGrad)" filter="url(#glow)"/>
    <!-- Play Triangle -->
    <polygon points="-8,-16 -8,16 18,0" fill="#ffffff"/>
  </g>

  <!-- Video Titles -->
  <text x="420" y="315" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Project Demo 03 — Multimodal Assistive Prototype & Sensory Feedback</text>
  <text x="420" y="340" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Assistive Tech • Obstacle Localization • Spatial Audio Sonification</text>

  <!-- Call to action pill -->
  <rect x="310" y="360" width="220" height="30" rx="15" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
  <text x="420" y="380" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">▶ CLICK TO STREAM VIDEO</text>

  <!-- Bottom Player Controls Bar -->
  <rect x="2" y="412" width="836" height="46" rx="14" fill="#020617" fill-opacity="0.9"/>
  <line x1="2" y1="412" x2="838" y2="412" stroke="#1e293b" stroke-width="1"/>

  <!-- Timeline / Progress Bar -->
  <rect x="24" y="420" width="792" height="4" rx="2" fill="#334155"/>
  <rect x="24" y="420" width="280" height="4" rx="2" fill="#38bdf8"/>
  <circle cx="304" cy="422" r="5" fill="#38bdf8"/>

  <!-- Bottom Icons & Duration -->
  <!-- Play Icon -->
  <polygon points="26,436 26,448 36,442" fill="#94a3b8"/>
  <!-- Volume Icon -->
  <path d="M52 438 L58 438 L64 434 L64 450 L58 446 L52 446 Z" fill="#94a3b8"/>
  <!-- Duration Text -->
  <text x="80" y="445" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">00:00 / 00:45</text>
  
  <!-- Direct Stream indicator -->
  <text x="750" y="445" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">1080p HD ↗</text>
</svg>