name: Auto-Update Profile & Repositories

on:
  schedule:
    # Automatically runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'

permissions:
  contents: write

jobs:
  sync-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Latest Repositories & Sync README
        run: node scripts/update-profile.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(auto): synchronize latest repositories list [skip ci]"
            git push
          else
            echo "No repository changes detected. Everything up to date."
          fi
